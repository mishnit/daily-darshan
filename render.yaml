# Render Blueprint for the Daily Darshan WhatsApp webhook.
services:
  - type: web
    name: daily-darshan-webhook
    runtime: python
    plan: free
    numInstances: 1

    # Deploy code/config changes automatically, but skip docs/ and csv/-only commits.
    autoDeployTrigger: commit
    buildFilter:
      ignoredPaths:
        - docs/**
        - csv/**

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: WEBHOOK_BEST_EFFORT_QUEUE
        value: "true"
      - key: WEBHOOK_SINGLE_WRITER
        value: "true"
      - key: WEBHOOK_SENDER_WORKERS
        value: "320"
      - key: WEBHOOK_SENDER_CAPACITY
        value: "5000"
      - key: WEBHOOK_PAYMENT_REFRESH_SECONDS
        value: "15"
      - key: WEBHOOK_DEDUPE_MAX_ROWS
        value: "120000"
      - key: WEBHOOK_DEDUPE_PRUNE_INTERVAL
        value: "10000"

      # Set each value in Render Dashboard; never commit secrets.
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
