# Render Blueprint for the Daily Darshan WhatsApp webhook.
services:
  - type: web
    name: daily-darshan-webhook
    runtime: python
    plan: free
    numInstances: 1

    # Deploy code/config changes automatically, but skip docs/ and csv/-only commits.
    autoDeployTrigger: commit
    buildFilter:
      ignoredPaths:
        - docs/**
        - csv/**

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"

      # Set each value in Render Dashboard; never commit secrets.
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
