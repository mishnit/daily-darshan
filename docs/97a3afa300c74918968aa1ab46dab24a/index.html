<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="darshan-subscription" content="97a3afa300c74918968aa1ab46dab24a">
  <meta name="darshan-date" content="2026-09-21">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Daily Darshan — 2026-09-21">
  <meta property="og:description" content="Delivered — 2026-09-21">
  <meta property="og:image" content="https://vipseva.com/images/5072d718-c719-5c70-9606-c0b07097d449_2026-09-21.jpg">
  <style>
    html, body { height: 100%; }
    body { font-family: system-ui, sans-serif; margin: 0; overflow: hidden;
            background: #faf6ef; color: #2b2b2b; }
    .wrap { box-sizing: border-box; display: flex; flex-direction: column;
             width: 100%; max-width: 640px; height: 100svh;
             margin: 0 auto; padding: 6px 0 0; text-align: center; }
    h1 { flex: 0 0 auto; margin: 0 8px 4px; color: #34291f;
          font-size: 1.05rem; line-height: 1.2; }
    .greeting { flex: 0 0 auto; margin: 0 8px; color: #53483c;
                 font-size: .86rem; font-weight: 600; }
    .image-frame { display: flex; flex: 0 1 auto; align-items: flex-start;
                    justify-content: center; min-height: 0; margin: 0 8px;
                    overflow: hidden; }
    img.darshan { display: block; width: auto; height: auto;
                   max-width: 100%; max-height: 100%; border-radius: 12px 12px 0 0;
                   box-shadow: 0 4px 16px rgba(0,0,0,.12); }
    .renewal, .share, .event-card, .daily-shloka { flex: 0 0 auto; padding: 9px 10px;
                       background: #fff3cd; color: #664d03;
                       font-size: .8rem; line-height: 1.35; }
    .renewal { margin: 6px 8px 0; border-radius: 10px 10px 0 0; }
    .event-card { margin: 6px 8px; border-radius: 10px; background: #fff0f5;
                   color: #672146; }
    .event-card p { margin: 3px 0; }
    .daily-shloka { margin: 6px 8px; border-radius: 10px; background: #eef7ff;
                     color: #164c72; }
    .daily-shloka p { margin: 3px 0; }
    .share { margin: 0 8px 6px; border-radius: 0 0 10px 10px; }
    .renewal p, .share p { margin: 0 0 7px; }
    .renewal a, .share a { display: inline-block; padding: 7px 12px; border-radius: 7px;
                           color: #fff; text-decoration: none; font-weight: 650; }
    .renewal a { background: #c62828; }
    .share a, .share button { background: #198754; }
    .share button { border: 0; border-radius: 7px; padding: 10px 16px;
                     color: white; font: inherit; font-weight: 650; cursor: pointer; }
    .privacy-note { margin: 3px 8px; font-size: .72rem; color: #53483c; }
    .karma { margin: 5px 8px; font-size: .86rem; font-weight: 700; color: #7a4b00; }
    .share textarea { box-sizing: border-box; width: 100%; min-height: 90px; }
    body { overflow-y: auto; }
    .renewal + .image-frame img { border-radius: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1><strong>🕉&#xA0;</strong>&#x20;Daily Darshan</h1>
    <div class="greeting">Radhe Radhe Priyanka Gautam Ji 🙏</div>
    <div class="greeting">Your Daily Darshan subscription is active till 2026-10-16</div>
    
    <section class="daily-shloka" aria-label="Today's shloka"><strong>Mahakal · Today's Shloka</strong><p lang="sa">ॐ नमः शिवाय।</p></section>
    
    <div class="image-frame">
      <img class="darshan" src="https://vipseva.com/images/5072d718-c719-5c70-9606-c0b07097d449_2026-09-21.jpg" alt="Daily Darshan for 2026-09-21"
           onerror="this.onerror=null; this.src='https://vipseva.com/images/fallback.jpg';">
    </div>
    <div class="share">
      <p class="privacy-note">Share Darshan on WhatsApp and earn 1 Karma point daily.</p>
      <p class="karma">Karma points: <span id="karma-points">0</span></p>
      <button id="share-darshan" type="button" data-image-url="https://vipseva.com/images/5072d718-c719-5c70-9606-c0b07097d449_2026-09-21.jpg" data-share-text="Radhe Radhe 🙏

Today&#x27;s HD Daily Darshan.

Visit VIP Seva for daily darshan:
https://vipseva.com/?ref=919108711599">Share Darshan on WhatsApp</button>
      <p id="share-status" role="status" aria-live="polite"></p>
    </div>
  </div>
<script>
(() => {
  const button = document.getElementById('share-darshan');
  const status = document.getElementById('share-status');
  if (!button) return;
  let file;
  const imageUrl = button.dataset.imageUrl;
  const text = button.dataset.shareText;
  const karmaApi = "https://daily-darshan-webhook.onrender.com/karma/share";
  const subscriptionId = "97a3afa300c74918968aa1ab46dab24a";
  const points = document.getElementById('karma-points');
  fetch(imageUrl).then(r => { if (!r.ok) throw new Error('image unavailable'); return r.blob(); })
    .then(blob => { file = new File([blob], 'daily-darshan.jpg', {type: blob.type || 'image/jpeg'}); })
    .catch(() => { status.textContent = 'Image sharing is unavailable on this browser.'; });
  button.addEventListener('click', async () => {
    if (!file || !navigator.share || !navigator.canShare || !navigator.canShare({files: [file]})) {
      status.textContent = 'Please use a mobile browser with WhatsApp sharing enabled.';
      return;
    }
    try {
      await navigator.share({files: [file], text});
      if (!karmaApi) { status.textContent = 'Darshan shared.'; return; }
      try {
        const response = await fetch(karmaApi, {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({subscription_id: subscriptionId})
        });
        if (!response.ok) throw new Error('reward unavailable');
        const reward = await response.json();
        if (reward.awarded && points) points.textContent = String(Number(points.textContent || '0') + 1);
        status.textContent = reward.awarded ? 'Darshan shared. You earned 1 Karma point.' : 'Darshan shared. Today’s Karma point was already earned.';
      } catch (rewardError) {
        status.textContent = 'Darshan shared, but the Karma point could not be recorded.';
      }
    }
    catch (error) { if (error.name !== 'AbortError') status.textContent = 'Sharing could not be opened.'; }
  });
})();
</script>
</body>
</html>
