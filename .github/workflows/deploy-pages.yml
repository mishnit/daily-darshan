name: Deploy Daily Darshan Pages

on:
  workflow_run:
    workflows: ["Daily Image", "Regenerate Daily Pages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      deliver:
        description: "Start today's delivery after a successful deployment"
        required: true
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      published: ${{ steps.result.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Confirm the triggering workflow rendered pages
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          result="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs" --jq '[.jobs[] | select(.name == "pages") | .conclusion] | length == 1 and .[0] == "success"')"
          echo "ready=$result" >> "$GITHUB_OUTPUT"

      - name: Read rendered artifact date
        id: rendered_date
        run: |
          value="$(python3 -c 'import json; print(json.load(open("docs/image-approval.json"))["date"])' 2>/dev/null || true)"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Verify approved image has been published to the page artifact
        id: approval
        if: steps.trigger.outputs.ready == 'true' && steps.rendered_date.outputs.value != ''
        run: python3 -m application.image_approval --published --date "${{ steps.rendered_date.outputs.value }}"

      - uses: actions/configure-pages@v5
        if: steps.trigger.outputs.ready == 'true' && steps.rendered_date.outputs.value != '' && steps.approval.outputs.ready == 'true'

      - uses: actions/upload-pages-artifact@v4
        if: steps.trigger.outputs.ready == 'true' && steps.rendered_date.outputs.value != '' && steps.approval.outputs.ready == 'true'
        with:
          path: docs

      - name: Deploy GitHub Pages
        if: steps.trigger.outputs.ready == 'true' && steps.rendered_date.outputs.value != '' && steps.approval.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record whether deployment completed
        id: result
        if: always()
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
        run: |
          if [ "$DEPLOYMENT_OUTCOME" = "success" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  delivery:
    needs: deploy
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deliver &&
      needs.deploy.result == 'success' &&
      needs.deploy.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Start delivery after deployment completes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run delivery.yml --repo "${{ github.repository }}" --ref main
