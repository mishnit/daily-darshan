name: Daily Delivery

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: pytest -q

      - name: Configure git author
        run: |
          git config user.name "daily-darshan-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Expire lapsed subscriptions
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          # Run expiry script but capture its exit code so we can handle the "nothing to commit" case
          python scheduler.py expiry || EXIT_CODE=$?

          # Ensure git author is configured (redundant with earlier step but harmless)
          git config user.name "daily-darshan-bot"
          git config user.email "bot@users.noreply.github.com"

          # Stage any changes the expiry script made
          git add -A

          # If there are no staged changes, skip committing. If the expiry script failed but there
          # are also no changes, treat the run as successful (this handles the common "nothing to commit" failure).
          if git diff --cached --quiet; then
            echo "No changes to commit"
            if [ -n "${EXIT_CODE:-}" ]; then
              echo "expiry script exited with $EXIT_CODE but there are no changes; treating as success."
              exit 0
            fi
          else
            git commit -m "Expiry sweep $(date +%Y-%m-%d)"
            git push
            # If the expiry script previously failed, surface that failure after committing changes
            if [ -n "${EXIT_CODE:-}" ]; then
              echo "expiry script exited with $EXIT_CODE; exiting with same code after committing changes"
              exit $EXIT_CODE
            fi
          fi

      - name: Send renewal reminders
        env:
          GITHUB_REPO: ${{ github.repository }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
        run: python scheduler.py renewal

      - name: Deliver today's image
        env:
          GITHUB_REPO: ${{ github.repository }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
        run: python scheduler.py delivery
