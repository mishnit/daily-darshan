name: Daily Delivery

on:
  workflow_run:
    workflows: ["Deploy Daily Darshan Pages"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  delivery:
    if: (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: daily-darshan-repository-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate delivery secrets
        env:
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
        run: |
          missing=0
          for name in WHATSAPP_ACCESS_TOKEN WHATSAPP_PHONE_NUMBER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub Actions secret::$name is required for WhatsApp delivery"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        run: pytest -q

      - name: Configure git author
        run: |
          git config user.name "Daily Darshan Automation"
          git config user.email "geekymishnit@gmail.com"

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          test -n "$GPG_PRIVATE_KEY" || { echo "GPG_PRIVATE_KEY secret is required" >&2; exit 1; }
          test -n "$GPG_PASSPHRASE" || { echo "GPG_PASSPHRASE secret is required" >&2; exit 1; }
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$fingerprint" || { echo "No imported GPG secret key found" >&2; exit 1; }
          preset_passphrase="$(command -v gpg-preset-passphrase || true)"
          if [ -z "$preset_passphrase" ] && [ -x /usr/lib/gnupg2/gpg-preset-passphrase ]; then
            preset_passphrase=/usr/lib/gnupg2/gpg-preset-passphrase
          fi
          test -n "$preset_passphrase" || { echo "gpg-preset-passphrase is unavailable" >&2; exit 1; }
          while IFS= read -r keygrip; do
            printf '%s' "$GPG_PASSPHRASE" | "$preset_passphrase" --preset "$keygrip"
          done < <(gpg --batch --with-colons --with-keygrip --list-secret-keys "$fingerprint" | awk -F: '$1 == "grp" { print $10 }')
          printf 'GitHub Actions signing check' | gpg --batch --yes --local-user "$fingerprint" --detach-sign --output "$RUNNER_TEMP/signing-check.sig"
          git config --global user.signingkey "$fingerprint"
          git config --global commit.gpgsign true
          echo "GIT_COMMIT_GPG_SIGN=true" >> "$GITHUB_ENV"

      - name: Prune operational logs to 30 days
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: python scheduler.py cleanup

      - name: Expire lapsed subscriptions
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: python scheduler.py expiry

      - name: Send committed activation welcomes after publication
        id: welcome
        continue-on-error: true
        env:
          GITHUB_REPO: ${{ github.repository }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
        run: python scheduler.py welcome

      - name: Send renewal reminders
        id: renewal
        env:
          GITHUB_REPO: ${{ github.repository }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
        run: python scheduler.py renewal

      - name: Keep renewal and delivery messages apart
        id: message_gap
        env:
          WHATSAPP_MESSAGE_GAP_SECONDS: ${{ vars.WHATSAPP_MESSAGE_GAP_SECONDS || '300' }}
          RENEWAL_SENT_COUNT: ${{ steps.renewal.outputs.sent_count || '0' }}
        run: |
          gap_seconds="${WHATSAPP_MESSAGE_GAP_SECONDS:-300}"
          renewal_sent="${RENEWAL_SENT_COUNT:-0}"
          case "$gap_seconds" in
            ''|*[!0-9]*)
              echo "::error title=Invalid message gap::WHATSAPP_MESSAGE_GAP_SECONDS must be a non-negative whole number"
              exit 1
              ;;
          esac
          case "$renewal_sent" in
            ''|*[!0-9]*)
              echo "::error title=Invalid renewal result::Renewal sent count must be a non-negative whole number"
              exit 1
              ;;
          esac
          if [ "$renewal_sent" -eq 0 ]; then
            echo "deliver=true" >> "$GITHUB_OUTPUT"
            echo "No renewal reminder was sent; proceeding immediately with Daily Darshan delivery"
            exit 0
          fi
          if [ "$gap_seconds" -eq 0 ]; then
            echo "deliver=true" >> "$GITHUB_OUTPUT"
            echo "Renewal recipients are protected by the daily send ledger; proceeding without a delay"
            exit 0
          fi
          echo "deliver=true" >> "$GITHUB_OUTPUT"
          echo "Waiting ${gap_seconds} seconds before Daily Darshan delivery"
          sleep "$gap_seconds"

      - name: Deliver today's image
        if: steps.message_gap.outputs.deliver == 'true'
        env:
          GITHUB_REPO: ${{ github.repository }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
        run: python scheduler.py delivery

      - name: Surface unresolved activation welcomes
        if: always() && steps.welcome.outcome == 'failure'
        run: |
          echo "::error::Activation welcomes need retry or reconciliation; inspect welcomes.csv"
          exit 1
