name: Retry WhatsApp Replies

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: retry-whatsapp-replies
  cancel-in-progress: false

jobs:
  retry:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Render reply worker
        env:
          WEBHOOK_BASE_URL: ${{ vars.WEBHOOK_BASE_URL }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
        run: |
          python3 - <<'PY'
          import hashlib, hmac, json, os, socket, time, urllib.error, urllib.request
          from urllib.parse import urlsplit
          base = os.environ['WEBHOOK_BASE_URL'].rstrip('/')
          secret = os.environ['WHATSAPP_APP_SECRET']
          if not secret or urlsplit(base).scheme != 'https' or not urlsplit(base).netloc:
              raise SystemExit('Configure WEBHOOK_BASE_URL and WHATSAPP_APP_SECRET')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          for attempt in range(1, 4):
              body = json.dumps({'timestamp': int(time.time())}).encode()
              signature = hmac.new(secret.encode(), body, hashlib.sha256).hexdigest()
              request = urllib.request.Request(base + '/internal/retry-replies', data=body,
                  headers={'Content-Type': 'application/json', 'X-Hub-Signature-256': 'sha256=' + signature})
              try:
                  with opener.open(request, timeout=45) as response:
                      print('Reply worker HTTP status:', response.status)
                      break
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, socket.timeout) as exc:
                  retryable = not isinstance(exc, urllib.error.HTTPError) or exc.code in {409, 423, 429, 500, 502, 503, 504}
                  if attempt == 3 or not retryable:
                      raise
                  delay = 5 * attempt
                  print(f'Render worker busy/unavailable ({exc}); retrying in {delay}s')
                  time.sleep(delay)
          PY
