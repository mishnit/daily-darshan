name: Pending Payment UTR Alert

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pending-payment-utr-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Alert admin about confirmed UTRs and missing UTRs
        env:
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ADMIN_NUMBERS: ${{ vars.WHATSAPP_ADMIN_NUMBERS }}
        run: python -m application.admin_alert payments
