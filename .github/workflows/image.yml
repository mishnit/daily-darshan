name: Daily Image

on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Number of days to fetch, including today (manual runs only)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "7"
      force_recollect:
        description: "Supersede existing approvals and queue fresh candidates (manual runs only)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: daily-darshan-repository-writes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Configure git author
        run: |
          git config user.name "Daily Darshan Automation"
          git config user.email "geekymishnit@gmail.com"

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          test -n "$GPG_PRIVATE_KEY" || { echo "GPG_PRIVATE_KEY secret is required" >&2; exit 1; }
          test -n "$GPG_PASSPHRASE" || { echo "GPG_PASSPHRASE secret is required" >&2; exit 1; }
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$fingerprint" || { echo "No imported GPG secret key found" >&2; exit 1; }
          preset_passphrase="$(command -v gpg-preset-passphrase || true)"
          if [ -z "$preset_passphrase" ] && [ -x /usr/lib/gnupg2/gpg-preset-passphrase ]; then
            preset_passphrase=/usr/lib/gnupg2/gpg-preset-passphrase
          fi
          test -n "$preset_passphrase" || { echo "gpg-preset-passphrase is unavailable" >&2; exit 1; }
          while IFS= read -r keygrip; do
            printf '%s' "$GPG_PASSPHRASE" | "$preset_passphrase" --preset "$keygrip"
          done < <(gpg --batch --with-colons --with-keygrip --list-secret-keys "$fingerprint" | awk -F: '$1 == "grp" { print $10 }')
          printf 'GitHub Actions signing check' | gpg --batch --yes --local-user "$fingerprint" --detach-sign --output "$RUNNER_TEMP/signing-check.sig"
          git config --global user.signingkey "$fingerprint"
          git config --global commit.gpgsign true

          # LocalGitRepository reads this explicit opt-in. It is intentionally
          # set only after a usable secret key has been imported.
          echo "GIT_COMMIT_GPG_SIGN=true" >> "$GITHUB_ENV"

      - name: Fetch and store daily images
        env:
          GITHUB_REPO: ${{ github.repository }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '1' }}
          FORCE_RECOLLECT: ${{ inputs.force_recollect || 'false' }}
        run: |
          # Scheduled runs always fetch today only. Backfill is deliberately
          # available only from an explicit manual dispatch.
          force_args=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$FORCE_RECOLLECT" = "true" ]; then
            force_args="--force-recollect"
          fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "$BACKFILL_DAYS" = "1" ]; then
            python scheduler.py image $force_args
            exit 0
          fi

          case "$BACKFILL_DAYS" in 2|7) ;; *) echo "Unsupported backfill_days: $BACKFILL_DAYS" >&2; exit 1 ;; esac
          # Fetch historic dates without rewriting subscriber pages each time.
          for offset in $(seq $((BACKFILL_DAYS - 1)) -1 1); do
            image_date="$(TZ=Asia/Kolkata date -d "today - ${offset} days" +%F)"
            echo "Fetching image for ${image_date}"
            if ! python scheduler.py image-only --date "$image_date" $force_args; then
              echo "::warning title=Historical image unavailable::Could not store an image for ${image_date}; continuing to today's required image"
            fi
          done
          # Today's normal job stores the image and refreshes subscriber pages.
          python scheduler.py image $force_args

      - name: Invite admin to select the image on WhatsApp
        env:
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ADMIN_NUMBERS: ${{ vars.WHATSAPP_ADMIN_NUMBERS }}
        run: python -m application.admin_alert images

      - name: Preserve image audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/darshan-image-audit/
          retention-days: 30
          if-no-files-found: ignore
